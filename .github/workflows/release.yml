name: release

on:
  push:
    # リリースタグ (2026.1.0 / 2026.1.0-canary.1 など) を打ったときだけ実行する
    tags:
      - '202*'

# gh release create でリリースを作成するため書き込み権限を付与する
permissions:
  contents: write

jobs:
  build_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04_x86_64
            runner: ubuntu-22.04
          - name: ubuntu-24.04_x86_64
            runner: ubuntu-24.04
          - name: ubuntu-26.04_x86_64
            runner: ubuntu-26.04
          # armv8 は x86_64 の runner から sysroot を使ってクロスコンパイルする
          - name: ubuntu-26.04_armv8
            runner: ubuntu-26.04
    name: Build zakuro for ${{ matrix.name }}
    # ビルドは apt と数 GB のダウンロードを伴うため ubuntu-slim は使わない
    runs-on: ${{ matrix.runner }}
    # 通常は 2〜3 分で完了するため、ハングを検出できるよう余裕を持たせて 30 分で打ち切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install deps
        run: |
          # runner のパッケージリストが古いことがあるため先に更新する
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install libx11-dev libxext-dev
          # armv8 向けのクロスコンパイルでは aarch64 のリンカが必要になる
          if [ "${{ matrix.name }}" = "ubuntu-26.04_armv8" ]; then
            DEBIAN_FRONTEND=noninteractive sudo apt-get -y install binutils-aarch64-linux-gnu
          fi
      - name: Build zakuro
        run: python3 run.py build ${{ matrix.name }} --package
      - name: Get package name
        shell: bash
        run: |
          source _package/${{ matrix.name }}/release/zakuro.env
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
        id: package_name
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_name.outputs.name }}
          path: _package/${{ matrix.name }}/release/${{ steps.package_name.outputs.name }}
      - name: Upload Environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}.env
          path: _package/${{ matrix.name }}/release/zakuro.env

  build_macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 15 以降の arm64 向けバイナリを作る
          - name: macos_arm64
            runner: macos-15
    name: Build zakuro for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # 通常は 3 分程度で完了するため、ハングを検出できるよう余裕を持たせて 30 分で打ち切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build zakuro
        run: python3 run.py build ${{ matrix.name }} --package
      - name: Get package name
        shell: bash
        run: |
          source _package/${{ matrix.name }}/release/zakuro.env
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
        id: package_name
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_name.outputs.name }}
          path: _package/${{ matrix.name }}/release/${{ steps.package_name.outputs.name }}
      - name: Upload Environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}.env
          path: _package/${{ matrix.name }}/release/zakuro.env

  create_release:
    name: Create Release
    needs:
      - build_linux
      - build_macos
    # ビルドを行わず gh コマンドだけで完結するため最小構成の runner を使う
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/download
        with:
          platform: ubuntu-22.04_x86_64
      - uses: ./.github/actions/download
        with:
          platform: ubuntu-24.04_x86_64
      - uses: ./.github/actions/download
        with:
          platform: ubuntu-26.04_x86_64
      - uses: ./.github/actions/download
        with:
          platform: ubuntu-26.04_armv8
      - uses: ./.github/actions/download
        with:
          platform: macos_arm64
      - name: Env to output
        run: |
          echo "package_paths=$(cat package_paths.env | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
        id: env
      - name: Release (Stable)
        if: ${{ !contains(github.ref, 'canary') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            ${{ steps.env.outputs.package_paths }}
      - name: Release (Canary)
        if: ${{ contains(github.ref, 'canary') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --prerelease \
            ${{ steps.env.outputs.package_paths }}
