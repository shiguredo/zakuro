name: ci

on:
  push:
    # タグ push は release.yml が担当するため ci.yml ではビルドしない
    tags-ignore:
      - '*'
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'THANKS'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'THANKS'
      - 'LICENSE'
      - 'NOTICE'

# 検証のみを行うため読み取り権限だけを付与する
permissions:
  contents: read

jobs:
  build_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04_x86_64 は pytest の実行対象を兼ねる
          - name: ubuntu-22.04_x86_64
            runner: ubuntu-22.04
          - name: ubuntu-24.04_x86_64
            runner: ubuntu-24.04
    name: Build zakuro for ${{ matrix.name }}
    # ビルドは apt と数 GB のダウンロードを伴うため ubuntu-slim は使わない
    runs-on: ${{ matrix.runner }}
    # 通常は 2〜3 分で完了するため、ハングを検出できるよう余裕を持たせて 30 分で打ち切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install deps
        run: |
          # runner のパッケージリストが古いことがあるため先に更新する
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install libx11-dev libxext-dev
      - name: Build zakuro
        run: python3 run.py build ${{ matrix.name }}
  build_macos:
    strategy:
      fail-fast: false
      matrix:
        name:
          - macos_arm64
    name: Build zakuro for ${{ matrix.name }}
    runs-on: macos-15
    # 通常は 3 分程度で完了するため、ハングを検出できるよう余裕を持たせて 30 分で打ち切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build zakuro
        run: python3 run.py build ${{ matrix.name }}
