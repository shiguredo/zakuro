name: debug-abort

# abort 時のバックトレースを取得する調査専用のワークフロー
# feature/debug- ブランチ上でのみ使い、マージしない
on:
  push:
    branches:
      - 'feature/debug-multi-signaling-url-abort'

jobs:
  debug:
    name: Capture backtrace with gdb
    # ビルドと gdb を実行するため最小構成の runner は使わない
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 実 Sora に接続するため組織シークレットを受け取る
      TEST_SIGNALING_URLS: ${{ secrets.TEST_SIGNALING_URLS }}
      TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install deps
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install libx11-dev libxext-dev gdb
      - name: Build zakuro
        run: python3 run.py build ubuntu-24.04_x86_64
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run zakuro under gdb
        # test/pyproject.toml の環境 (pyjwt) を使うため --project を指定する
        run: uv run --project test python debug_abort.py
