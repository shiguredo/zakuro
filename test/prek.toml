# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# test ディレクトリは uv プロジェクトのルートであり、uv コマンドを作業ディレクトリから
# 実行する必要があるため、Python の hooks はここに置く
default_stages = ["pre-commit"]

# ruff: フォーマッタ・リンタ
# ruff のバイナリはフックが自前で用意するため、pyproject.toml の依存には含めない
# rev がそのまま ruff のバージョンになる。更新は prek update で行う
# 設定は pyproject.toml の [tool.ruff] を読む
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.9"
hooks = [
  # ruff format: フォーマッタ
  { id = "ruff-format", priority = 0 },
  # ruff check: リンタ
  { id = "ruff-check", priority = 10 },
]

# ty: 静的型チェッカ
# ty のバイナリはフックが自前で用意するため、pyproject.toml の依存には含めない
# rev がそのまま ty のバージョンになる。更新は prek update で行う
# フックは uv check 経由で動き、pyproject.toml の依存を解決してから型検査する
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.84"
hooks = [
  { id = "ty", priority = 20 },
]

# プロジェクト固有のローカルフック
[[repos]]
repo = "local"

# pytest: 実バイナリを起動する E2E テスト
# ビルド済みの zakuro が _build に無い場合は失敗するため、事前に
# python3 run.py build <target> を実行しておくこと
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest"
language = "system"
types = ["python"]
pass_filenames = false
priority = 30
